# One public port (8501, the Space's app_port) in front of two apps:
#   /v1/* and /healthz -> the OpenAI-compatible agent API (uvicorn, 127.0.0.1:8000)
#   everything else    -> the Streamlit chat UI (127.0.0.1:8502), including its WebSocket
# Runs as the Space's non-root user, so every writable path lives in /tmp.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 256; }

http {
    access_log off;
    client_body_temp_path /tmp/nginx-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;
    client_max_body_size 4m;

    map $http_upgrade $connection_upgrade { default upgrade; '' close; }

    server {
        listen 8501;

        # An agent answer can take several tool calls; give it time.
        location /v1/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }
        location = /healthz { proxy_pass http://127.0.0.1:8000; }

        location / {
            proxy_pass http://127.0.0.1:8502;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 86400s;
        }
    }
}
